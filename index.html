<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/app-icon-192.png"
    />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pixel Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Instant boot shell: visible while JS modules download (replaces white screen). -->
      <div
        id="ms-boot-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 25000;
          background: radial-gradient(ellipse at 30% 20%, #e8f5f3 0%, #f4f6f8 45%, #eef1f4 100%);
          font-family: Outfit, system-ui, sans-serif;
        "
      >
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: min(360px, 80vw);
            padding: 20px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
          "
        >
          <div style="font-weight: 600; font-size: 1.05rem; color: #0f172a">
            Pixel Mockup
          </div>
          <div style="font-weight: 500; font-size: 0.95rem; color: #334155">
            Starting workspace…
          </div>
          <div
            style="
              width: 100%;
              height: 6px;
              border-radius: 999px;
              background: #e2e8f0;
              overflow: hidden;
            "
          >
            <div
              style="
                width: 35%;
                height: 100%;
                border-radius: 999px;
                background: linear-gradient(90deg, #0f766e, #14b8a6);
                animation: ms-boot-pulse 1.2s ease-in-out infinite;
              "
            ></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes ms-boot-pulse {
          0% {
            transform: translateX(-120%);
          }
          100% {
            transform: translateX(320%);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
